<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <title>🐝 Otheniel Spelling Bee • Grades 1–3</title>
  <style>
    /* =========================================================
       MATERIAL YOU (Android 17) DESIGN TOKENS
       ========================================================= */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --primary:#800020;
      --on-primary:#FFFFFF;
      --primary-container:#F6E8EC;
      --on-primary-container:#4A0011;
      --secondary-container:#EFE3E7;
      --on-secondary-container:#3E2028;
      --tertiary-container:#FAF0F3;
      --on-tertiary-container:#5A2533;
      --surface:#FFFFFF;
      --surface-container-low:#FCF7F9;
      --surface-container:#F7EEF1;
      --surface-container-high:#F2E6EA;
      --on-surface:#2A1A20;
      --on-surface-variant:#5C4A50;
      --outline:#9E858D;
      --outline-variant:#DECED3;
      --error:#B3261E;
      --error-container:#F9DEDC;
      --on-error-container:#410E0B;
      --success:#146C2E;
      --success-container:#C4EED0;
      --radius-xl:28px;
      --radius-lg:20px;
      --radius-md:16px;
      --radius-sm:12px;
      --elevation1:0 1px 2px rgba(0,0,0,.30),0 1px 3px 1px rgba(0,0,0,.15);
      --elevation2:0 1px 2px rgba(0,0,0,.30),0 2px 6px 2px rgba(0,0,0,.15);
      --elevation3:0 1px 3px rgba(0,0,0,.30),0 4px 8px 3px rgba(0,0,0,.15);
    }
    body {
      font-family:'Google Sans','Roboto','Segoe UI',system-ui,-apple-system,sans-serif;
      background:linear-gradient(180deg,#FFFFFF 0%,#F7EEF1 100%);
      min-height:100vh;
      color:var(--on-surface);
      -webkit-tap-highlight-color:transparent;
    }
    .app-container { max-width:920px; width:100%; margin:0 auto; padding:1rem 1rem 2rem; }

    /* ---------- Top app bar ---------- */
    .header { display:flex; align-items:center; justify-content:center; padding:.8rem 0 1.2rem; }
    .header h1 { font-size:1.7rem; font-weight:700; letter-spacing:-0.5px; color:var(--on-surface); display:flex; align-items:center; gap:10px; }
    .header h1 span { font-size:1.7rem; line-height:1; }
    .header .app-name { color:var(--primary); font-weight:800; }

    /* ---------- Segmented tabs (M3) ---------- */
    .tabs { display:flex; justify-content:center; margin-bottom:1.4rem; }
    .tabs > * { position:relative; }
    .tab-btn {
      position:relative; overflow:hidden;
      background:transparent; border:none;
      color:var(--on-surface-variant);
      font-size:1rem; font-weight:600; letter-spacing:.1px;
      padding:.75rem 2rem; cursor:pointer;
      transition:all .18s ease;
    }
    .tab-btn:first-child { border-radius:24px 4px 4px 24px; }
    .tab-btn:last-child  { border-radius:4px 24px 24px 4px; }
    .tab-btn.active { background:var(--primary-container); color:var(--on-primary-container); box-shadow:var(--elevation1); }
    .tab-btn:first-child.active { border-radius:24px 4px 4px 24px; }
    .tab-btn:last-child.active  { border-radius:4px 24px 24px 4px; }
    /* wrap so the active segment sits on a track */
    .tabs { background:var(--surface-container-high); border-radius:28px; padding:4px; width:max-content; margin-left:auto; margin-right:auto; }

    /* ---------- Grade filter chips (buttons) ---------- */
    .grade-badge { display:flex; justify-content:center; gap:10px; margin-bottom:1.4rem; flex-wrap:wrap; }
    .grade-btn {
      position:relative; overflow:hidden;
      background:transparent;
      border:1.5px solid var(--outline);
      color:var(--primary);
      font-size:1rem; font-weight:600;
      padding:.55rem 1.2rem; border-radius:var(--radius-lg);
      cursor:pointer; transition:all .15s ease;
      display:inline-flex; align-items:center; gap:6px;
      font-family:inherit;
    }
    .grade-btn.active { background:var(--primary-container); border-color:transparent; color:var(--on-primary-container); box-shadow:var(--elevation1); }
    .count-badge { font-size:.78rem; font-weight:700; background:var(--primary); color:#fff; padding:2px 8px; border-radius:8px; }
    .grade-btn.active .count-badge { background:var(--on-primary-container); color:var(--primary-container); }

    /* ---------- Cards ---------- */
    .card-area {
      background:var(--surface-container-low);
      border-radius:var(--radius-xl);
      padding:2rem 1.8rem 1.6rem;
      box-shadow:var(--elevation1);
      margin-bottom:1.2rem;
      border:1px solid var(--outline-variant);
    }

    /* ---------- Word display ---------- */
    .word-display { text-align:center; margin-bottom:2rem; }
    .word {
      font-size:4.2rem; font-weight:700; color:var(--on-surface);
      text-transform:uppercase; letter-spacing:6px; word-break:break-word; line-height:1.15;
      margin-bottom:1rem;
    }
    .hint {
      font-size:1.15rem; color:var(--on-surface-variant);
      background:var(--surface-container-high);
      display:inline-block; padding:.55rem 1.4rem; border-radius:10px;
      font-weight:500;
    }

    /* ---------- Speaker FAB ---------- */
    .speaker-big {
      width:88px; height:88px; border-radius:50%;
      background:var(--primary-container); color:var(--on-primary-container);
      display:inline-flex; align-items:center; justify-content:center;
      font-size:2.4rem; cursor:pointer; user-select:none;
      box-shadow:var(--elevation2);
      transition:box-shadow .15s ease, transform .12s ease;
      position:relative; overflow:hidden;
      margin:.5rem 0 1rem;
    }
    .speaker-big:hover { box-shadow:var(--elevation3); transform:scale(1.04); }
    .speaker-big:active { transform:scale(.96); }
    .speaker-big.speaking { animation:pulse 1.2s infinite; background:var(--primary); color:#fff; }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }

    /* ---------- Spell inputs (M3 outlined text fields) ---------- */
    .spell-area { text-align:center; }
    .spell-instruction { font-size:1.15rem; color:var(--on-surface-variant); margin-bottom:1rem; font-weight:500; }
    .dash-row { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:1.4rem 0; }
    .dash-input {
      width:52px; height:64px; font-size:1.9rem; font-weight:600; text-align:center;
      text-transform:uppercase; color:var(--on-surface); background:var(--surface);
      border:1.5px solid var(--outline); border-radius:var(--radius-md); outline:none;
      transition:border-color .15s, box-shadow .15s;
      caret-color:var(--primary);
      font-family:inherit;
    }
    .dash-input:focus { border:2px solid var(--primary); }
    .dash-input.filled { border-color:var(--primary); background:var(--surface-container-low); }
    .dash-input.correct { border:2px solid var(--success); background:var(--success-container); color:var(--success); }
    .dash-input.wrong   { border:2px solid var(--error); background:var(--error-container); color:var(--error); animation:shake .3s; }
    @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

    /* ---------- Feedback ---------- */
    .feedback { font-size:1.5rem; font-weight:700; margin-top:1.2rem; min-height:2.2rem; letter-spacing:.1px; }
    .feedback.correct { color:var(--success); }
    .feedback.wrong { color:var(--error); }
    .feedback.idle { color:var(--on-surface-variant); }

    /* ---------- Hint chip ---------- */
    .spell-hint-box {
      display:inline-block; background:var(--surface-container-high);
      padding:.8rem 1.4rem; border-radius:var(--radius-lg);
      font-size:1rem; color:var(--on-surface-variant);
      margin-top:.6rem; max-width:92%; line-height:1.6;
      border:1px solid var(--outline-variant);
    }
    .spell-hint-box.revealed { background:var(--secondary-container); color:var(--on-secondary-container); border-color:transparent; }

    /* ---------- M3 Buttons ---------- */
    .actions, .spell-actions { display:flex; justify-content:center; flex-wrap:wrap; gap:.7rem; margin:1.4rem 0 .6rem; }
    .btn {
      position:relative; overflow:hidden;
      border:none; border-radius:var(--radius-lg);
      height:48px; padding:0 22px;
      font-size:.98rem; font-weight:600; letter-spacing:.1px;
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      cursor:pointer; transition:box-shadow .15s ease, filter .15s ease;
      min-width:104px; font-family:inherit;
    }
    .btn:hover { box-shadow:var(--elevation1); }
    .btn:active { filter:brightness(.92); }
    .btn:disabled { opacity:.45; pointer-events:none; }

    /* Filled button (primary) — speak & check */
    .btn.speak { background:var(--primary); color:var(--on-primary); }
    .btn.check { background:var(--primary); color:var(--on-primary); min-width:140px; }
    /* Filled tonal — prev / next */
    .btn.prev { background:var(--secondary-container); color:var(--on-secondary-container); }
    .btn.next { background:var(--primary-container); color:var(--on-primary-container); }
    /* Tertiary tonal — shuffle & hint */
    .btn.shuffle { background:var(--tertiary-container); color:var(--on-tertiary-container); }
    .btn.hint  { background:var(--secondary-container); color:var(--on-secondary-container); }
    /* Error tonal — reset */
    .btn.reset { background:var(--error-container); color:var(--on-error-container); }

    /* ---------- M3 Linear progress indicator ---------- */
    .progress-area {
      display:flex; align-items:center; gap:16px;
      background:var(--surface-container-low);
      border-radius:24px; padding:1rem 1.4rem;
      box-shadow:var(--elevation1);
      border:1px solid var(--outline-variant);
      flex-wrap:wrap;
    }
    .progress-text { font-size:1rem; font-weight:600; color:var(--on-surface); display:flex; align-items:center; gap:8px; white-space:nowrap; }
    .progress-bar-bg { flex:1; min-width:160px; height:8px; background:var(--surface-container-high); border-radius:4px; overflow:hidden; }
    .progress-fill { width:0%; height:100%; background:var(--primary); border-radius:4px; transition:width .3s ease; }
    .stars { display:flex; gap:4px; font-size:1.5rem; line-height:1; }
    .star { color:var(--outline-variant); transition:all .2s; }
    .star.filled { color:var(--primary); }

    /* ---------- Word bank ---------- */
    .word-list-toggle { text-align:right; margin-top:.8rem; font-size:.95rem; color:var(--primary); cursor:pointer; font-weight:600; display:inline-block; }
    .word-bank {
      margin-top:.8rem; background:var(--surface-container-low);
      border-radius:var(--radius-lg); padding:1rem 1.2rem;
      font-size:.95rem; color:var(--on-surface);
      display:flex; flex-wrap:wrap; gap:8px;
      border:1px solid var(--outline-variant);
      max-height:160px; overflow-y:auto;
    }
    .word-bank span { background:var(--surface-container-high); padding:.3rem .85rem; border-radius:8px; font-weight:500; }

    .hidden { display:none !important; }
    .footer-note { text-align:center; margin-top:1.4rem; font-size:.85rem; color:var(--on-surface-variant); }

    /* ---------- Tap ripple (Material) ---------- */
    .ripple {
      position:absolute; border-radius:50%;
      background:rgba(128,0,32,.22);
      transform:scale(0);
      animation:ripple .55s ease-out forwards;
      pointer-events:none;
    }
    .btn .ripple { background:rgba(128,0,32,.22); }
    .btn.speak .ripple, .btn.check .ripple, .grade-btn.active .ripple { background:rgba(255,255,255,.35); }
    @keyframes ripple { to { transform:scale(1); opacity:0; } }

    /* ---------- Responsive ---------- */
    @media (max-width:700px) {
      .header h1 { font-size:1.35rem; }
      .word { font-size:2.8rem; letter-spacing:4px; }
      .card-area { padding:1.4rem 1rem 1.2rem; border-radius:22px; }
      .btn { height:44px; padding:0 16px; font-size:.9rem; min-width:92px; }
      .speaker-big { width:72px; height:72px; font-size:2rem; }
      .hint { font-size:1rem; }
      .tab-btn { padding:.65rem 1.3rem; font-size:.95rem; }
      .progress-text { font-size:.95rem; }
      .feedback { font-size:1.3rem; }
    }
    @media (max-width:480px) {
      .word { font-size:2rem; letter-spacing:3px; }
      .grade-btn { font-size:.88rem; padding:.45rem .9rem; }
      .btn { font-size:.85rem; padding:0 12px; min-width:84px; gap:4px; }
      .speaker-big { width:60px; height:60px; font-size:1.6rem; }
      .dash-input { width:40px; height:52px; font-size:1.5rem; border-radius:12px; }
      .dash-row { gap:5px; }
      .feedback { font-size:1.15rem; }
      .spell-instruction { font-size:1rem; }
      .hint { font-size:.9rem; }
    }

    /* =========================================================
       KID-FRIENDLY PLAYFUL LAYER (on top of Material You)
       ========================================================= */
    .app-container { position:relative; z-index:1; }
    /* Floating background emojis */
    .bg-decor { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .bg-decor span { position:absolute; opacity:.30; animation:floaty 7s ease-in-out infinite; filter:saturate(1.2); }
    @keyframes floaty { 0%,100%{transform:translateY(0) rotate(-8deg);} 50%{transform:translateY(-26px) rotate(10deg);} }

    /* Playful display font + rainbow gradient word */
    .word {
      font-family:'Baloo 2','Fredoka','Google Sans','Roboto',sans-serif;
      font-weight:800;
      background:linear-gradient(92deg,#800020 0%,#9A2A45 35%,#B44662 70%,#D86B84 100%);
      -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent; color:transparent;
      letter-spacing:5px;
    }
    .hint { font-family:'Fredoka','Baloo 2',sans-serif; font-weight:600; }
    .header h1 { font-family:'Baloo 2','Fredoka',sans-serif; }
    .header h1 span { display:inline-block; animation:beeBounce 2.4s ease-in-out infinite; }
    .header h1 span:last-child { animation-delay:1.2s; }
    @keyframes beeBounce { 0%,100%{transform:translateY(0) rotate(0deg);} 30%{transform:translateY(-10px) rotate(-12deg);} 60%{transform:translateY(0) rotate(8deg);} }

    /* Word pops in when it changes */
    @keyframes wordPop { 0%{transform:scale(.5);opacity:0;} 55%{transform:scale(1.15);opacity:1;} 100%{transform:scale(1);opacity:1;} }
    .word.pop { animation:wordPop .45s cubic-bezier(.34,1.56,.64,1); }

    /* Golden wiggling stars */
    .star.filled { color:#F9A825; text-shadow:0 0 12px rgba(249,168,37,.55); animation:starWiggle .55s cubic-bezier(.34,1.56,.64,1); }
    @keyframes starWiggle { 0%{transform:scale(.3) rotate(-40deg);} 60%{transform:scale(1.45) rotate(12deg);} 100%{transform:scale(1) rotate(0);} }

    /* Shimmering progress fill */
    .progress-fill { background:linear-gradient(90deg,#800020,#96243D,#B03F5A,#C55A73,#D86B84,#C55A73,#B03F5A,#96243D,#800020); background-size:200% 100%; animation:shimmer 4s linear infinite; }
    @keyframes shimmer { to { background-position:200% 0; } }

    /* Confetti celebration */
    .confetti { position:fixed; top:-40px; z-index:999; pointer-events:none; animation:confettiFall linear forwards; }
    @keyframes confettiFall { to { transform:translateY(112vh) rotate(720deg); } }

    /* Bouncy buttons */
    .btn { border-radius:24px; }
    .btn:hover { transform:translateY(-2px); }
    .btn:active { transform:translateY(1px) scale(.97); }
    .grade-btn { border-radius:24px; transition:all .15s ease, transform .12s ease; }
    .grade-btn:hover { transform:translateY(-2px); }
    .grade-btn:active { transform:scale(.95); }
  </style>

</div>
<div class="app-container">

  <!-- STUDY TAB -->
  <div id="studyPanel">
    <div class="card-area">
      <div class="word-display">
        <div class="word" id="wordDisplay">PAT</div>
        <div class="hint" id="hintDisplay">tap lightly</div>

      <div class="actions">
        <button class="btn speak" id="speakBtn">🔊 Speak</button>
        <button class="btn prev" id="prevBtn">⬅️ Previous</button>
        <button class="btn next" id="nextBtn">➡️ Next</button>
        <button class="btn shuffle" id="shuffleBtn">🔀 Shuffle</button>
        <button class="btn reset" id="resetBtn">🔄 Reset</button>
      </div>
    </div>
  </div>

  <!-- SPELL TAB -->
  <div id="spellPanel" class="hidden">
    <div class="card-area">
      <div class="spell-area">

        <div class="speaker-big" id="speakerBig" title="Click to hear the word again">🔊</div>
        <div class="dash-row" id="dashRow"></div>
        <div class="spell-hint-box" id="spellHintBox">💡 Click "Hint" to hear the word again and get a clue</div>
        <div class="feedback idle" id="feedback">&nbsp;</div>
        <div class="spell-actions">
          <button class="btn speak" id="spellSpeakBtn">🔊 Hear Again</button>
          <button class="btn hint"  id="spellHintBtn">💡 Hint</button>
          <button class="btn check" id="spellCheckBtn">✅ Check</button>
          <button class="btn prev"  id="spellPrevBtn">⬅️ Previous</button>
          <button class="btn next"  id="spellNextBtn">➡️ Next Word</button>
          <button class="btn reset" id="spellResetBtn">🔄 Reset</button>
        </div>
      </div>
    </div>
  </div>

  <div class="progress-area">
    <div class="progress-text"><span>📚</span> <span id="progressLabel">1 / 145</span></div>
    <div class="progress-bar-bg"><div class="progress-fill" id="progressFill" style="width:1%"></div></div>
    <div class="stars" id="starsContainer"></div>
  </div>

  <div style="text-align:right; margin-top:.4rem;">
    <span class="word-list-toggle" id="toggleWordList">📋 show word bank</span>
  </div>
  <div class="word-bank hidden" id="wordBank"></div>

  <div class="footer-note">🐝 Otheniel Spelling Bee • Study hard, spell well!</div>
</div>

  /* Pick best American English voice — strict priority. */
  function pickAmericanVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    if (!voices.length) return null;

    // West African / Nigerian English voices take top priority
    const topWestAfrican = [
      'Google Nigerian English',
      'Google English (Nigeria)',
      'Microsoft Adeola Online (Natural) - English (Nigeria)',
      'Microsoft Abu Online (Natural) - English (Nigeria)',
      'Microsoft Nigerian English',
      'English (Nigeria)',
      'en-NG'
    ];
    for (const name of topWestAfrican) {
      const v = voices.find(v => v.name === name);
      if (v) return v;
    }
    // Any voice with lang exactly "en-NG" (Nigerian English)
    const exactNG = voices.find(v => v.lang === 'en-NG' || v.lang === 'en_NG' || v.lang === 'en-NG-ng');
    if (exactNG) return exactNG;
    // Any West African local language voice with a West African accent flavor (last resort among named)
    // Known high-quality US English voice names (Chrome, Edge, Safari, Windows)
    const topUS = [
      'Google US English',
      'Microsoft Aria Online (Natural) - English (United States)',
      'Microsoft Jenny Online (Natural) - English (United States)',
      'Microsoft Guy Online (Natural) - English (United States)',
      'Microsoft Michelle Online (Natural) - English (United States)',
      'Microsoft Zira - English (United States)',
      'Microsoft David - English (United States)',
      'Microsoft Mark - English (United States)',
      'Samantha',
      'Alex',
      'Ava',
      'Allison'
    ];
    for (const name of topUS) {
      const v = voices.find(v => v.name === name);
      if (v) return v;
    }
    // Any voice with lang exactly "en-US"
    const exactUS = voices.find(v => v.lang === 'en-US' || v.lang === 'en_US');
    if (exactUS) return exactUS;
    // Any voice with lang starting "en-US"
    const startsUS = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en-us'));
    if (startsUS) return startsUS;
    // Any English voice (fallback)
    return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) || null;
  }

  function loadVoices() {
    preferredVoice = pickAmericanVoice();

  /* Speak a single utterance. */
  function speakOnce(text, rate, pitch, onEnd, sessionId) {
    return new Promise((resolve) => {
      if (!('speechSynthesis' in window)) return resolve();
      if (typeof sessionId === 'number' && !isSpeechSessionActive(sessionId)) {
        return resolve(false);
      }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = rate;
      u.pitch = pitch || 1.0;
      u.volume = 1.0;
      if (!preferredVoice) preferredVoice = pickAmericanVoice();
      if (preferredVoice) u.voice = preferredVoice;
      u.onend = () => {
        if (onEnd && (!sessionId || isSpeechSessionActive(sessionId))) onEnd();
        resolve(typeof sessionId === 'number' ? isSpeechSessionActive(sessionId) : true);
      };
      u.onerror = () => resolve(false);
      window.speechSynthesis.speak(u);
    });
  }

  /* Break a word into syllable-ish chunks so each part is heard
     clearly. For short words (<= 4 letters) we say the whole word
     twice with a pause. For longer words we chunk them. */
  function syllabify(word) {
    const w = word.toUpperCase();
    // Short words: no need to chunk
    if (w.length <= 4) return [w, w];
    // Longer: split by vowel groups (rough but effective for clarity)
    const chunks = [];
    let cur = '';
    const vowels = 'AEIOUY';
    for (let i = 0; i < w.length; i++) {
      cur += w[i];
      const next = w[i + 1];
      const isVowel = vowels.includes(w[i]);
      const nextIsVowel = next ? vowels.includes(next) : false;
      // Break after a vowel if the next letter is a consonant and not the last letter
      if (isVowel && next && !nextIsVowel && cur.length >= 2 && i < w.length - 1) {
        chunks.push(cur);
        cur = '';
      }
    }
    if (cur) chunks.push(cur);
    // Cap chunks at 4 for performance
    if (chunks.length > 4) {
      // Merge middle chunks to keep total ≤ 4
      const head = chunks.slice(0, 2);
      const middle = chunks.slice(2, chunks.length - 1).join('');
      const tail = chunks[chunks.length - 1];
      return [...head, middle, tail, w];
    }
    return [...chunks, w];
  }

      // Grade 1: syllable-by-syllable for extra clarity
      const parts = syllabify(word);
      for (let i = 0; i < parts.length; i++) {
        const spoke = await speakOnce(parts[i], 0.5, 1.0, null, sessionId);
        if (!spoke) return;
        if (i < parts.length - 1) {
          const keepGoing = await pauseBetween(350, sessionId);
          if (!keepGoing) return;
        }
      }
    } else {
      // Grades 2 & 3: just pronounce the whole word once, at a natural pace
      const spoke = await speakOnce(word, 0.6, 1.0, null, sessionId);
      if (!spoke) return;
    }

    if (!isSpeechSessionActive(sessionId)) return;
    isSpeaking = false;
    speakerBig.classList.remove('speaking');
    spellSpeakBtn.disabled = false;
  }

  /* STUDY TAB: pronounce the word, then spell it letter-by-letter,
     repeated 3 times so the child can spell along. Used for ALL grades. */
  async function speakStudyWord() {
    const item = wordsList[currentIndex];
    if (!item) return;

    stopSpeech();
    const sessionId = speechSessionId;
    isSpeaking = true;
    speakerBig.classList.add('speaking');
    speakBtn.disabled = true;

    const word = item.word.toUpperCase();
    const len = word.length;

    // Short words stay at a normal study pace; long words slow down so letters stay distinct.
    const isLongWord = len > 8;
    const wordRate   = isLongWord ? 0.5 : 0.7;   // whole-word speed
    const letterRate = isLongWord ? 0.4 : 0.55;  // per-letter speed
    const wordPause  = isLongWord ? 850 : 500;   // pause after the word
    const letterPause= isLongWord ? 350 : 230;   // pause between letters

    // Small warm-up so the voice engine is ready
    const warmedUp = await speakOnce(' ', 0.5, 1.0, null, sessionId);
    if (!warmedUp) return;

    for (let rep = 0; rep < 3; rep++) {
      // 1) Pronounce the whole word clearly
      const spokeWord = await speakOnce(word, wordRate, 1.0, null, sessionId);
      if (!spokeWord) return;
      const keepGoingAfterWord = await pauseBetween(wordPause, sessionId);
      if (!keepGoingAfterWord) return;
      // 2) Spell it letter-by-letter so the child can spell along
      for (const ch of word) {
        const spokeLetter = await speakOnce(ch, letterRate, 1.0, null, sessionId);
        if (!spokeLetter) return;
        const keepGoingAfterLetter = await pauseBetween(letterPause, sessionId);
        if (!keepGoingAfterLetter) return;
      }
      // Brief pause before the next repetition
      if (rep < 2) {
        const keepGoingBeforeNextRepeat = await pauseBetween(800, sessionId);
        if (!keepGoingBeforeNextRepeat) return;
      }
    }

    if (!isSpeechSessionActive(sessionId)) return;
    isSpeaking = false;
    speakerBig.classList.remove('speaking');
    speakBtn.disabled = false;
  }

  /* Praise messages: slightly faster than the spelling word. */
  function speakPraise(text) {
    stopSpeech();
    speakOnce(text, 0.75, 1.0);
  }

  /* Used by Study tab's Speak button and Spell tab's Hear Again. */
  function speakCurrentWord() {
    speakWordClearly();
  }

  /* ---------- Navigation ---------- */
  function nextWord() {
    if (!wordsList.length) return;
    currentIndex = (currentIndex + 1) % wordsList.length;
    renderWord();
    updateProgress();
    resetSpellInputs();
  }

  function prevWord() {
    if (!wordsList.length) return;
    currentIndex = (currentIndex - 1 + wordsList.length) % wordsList.length;
    renderWord();
    updateProgress();
    resetSpellInputs();
  }

  function shuffleWords() {
    if (!wordsList.length) return;
    for (let i = wordsList.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [wordsList[i], wordsList[j]] = [wordsList[j], wordsList[i]];
    }
    currentIndex = 0;
    shuffled = true;
    renderWord();
    updateProgress();
    buildWordBank();
    stopSpeech();
    resetSpellInputs();
  }

  function resetProgress() {
    currentIndex = 0;
    if (shuffled) {
      wordsList = WORDS[currentGrade].slice();
      shuffled = false;
      buildWordBank();
    }
    renderWord();
    updateProgress();
    stopSpeech();
    resetSpellInputs();
  }

  /* ---------- SPELL TAB ---------- */
  function resetSpellInputs() {
    feedback.textContent = '\u00A0';
    feedback.className = 'feedback idle';
    spellHintBox.textContent = '💡 Click "Hint" to hear the word again and get a clue';
    spellHintBox.classList.remove('revealed');
    buildDashInputs();
  }

  function buildDashInputs() {
    const item = wordsList[currentIndex];
    if (!item) return;
    const len = item.word.length;
    dashRow.innerHTML = '';
    for (let i = 0; i < len; i++) {
      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 1;
      input.className = 'dash-input';
      input.autocomplete = 'off';
      input.autocapitalize = 'characters';
      input.spellcheck = false;
      input.setAttribute('aria-label', `Letter ${i+1}`);
      input.addEventListener('input', (e) => {
        const v = e.target.value.replace(/[^a-zA-Z]/g, '').toUpperCase();
        e.target.value = v;
        e.target.classList.toggle('filled', v.length === 1);
        if (v.length === 1) {
          const next = dashRow.children[i + 1];
          if (next) next.focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value) {
          const prev = dashRow.children[i - 1];
          if (prev) { prev.focus(); prev.value = ''; prev.classList.remove('filled'); }
        }
        if (e.key === 'ArrowLeft' && i > 0) dashRow.children[i-1].focus();
        if (e.key === 'ArrowRight' && i < len - 1) dashRow.children[i+1].focus();
        if (e.key === 'Enter') { e.preventDefault(); checkSpelling(); }
      });
      dashRow.appendChild(input);
    }
    setTimeout(() => { if (dashRow.children[0]) dashRow.children[0].focus(); }, 50);
  }

  function readSpelling() {
    let out = '';
    for (const inp of dashRow.children) {
      out += (inp.value || '').toUpperCase();
    }
    return out;
  }

  function checkSpelling() {
    const item = wordsList[currentIndex];
    if (!item) return;
    const target = item.word.toUpperCase();
    const attempt = readSpelling();

    if (attempt.length < target.length) {
      feedback.textContent = `✏️ Fill all ${target.length} boxes!`;
      feedback.className = 'feedback wrong';
      speakOnce("Please fill all the letters, Otheniel.", 0.7, 1.0);
      return;
    }

    if (attempt === target) {
      for (const inp of dashRow.children) inp.classList.add('correct');
      feedback.textContent = '🌟 Brilliant Otheniel! 🌟';
      feedback.className = 'feedback correct';
      speakPraise("Brilliant Otheniel!");
      launchConfetti();
    } else {
      for (const inp of dashRow.children) inp.classList.add('wrong');
      feedback.textContent = '💪 You can do it Otheniel, try again';
      feedback.className = 'feedback wrong';
      speakPraise("You can do it Otheniel, try again.");
      setTimeout(() => {
        for (const inp of dashRow.children) inp.classList.remove('wrong');
      }, 1200);
    }
  }

  /* ---- HINT: functional ---- */
  function showSpellHint() {
    const item = wordsList[currentIndex];
    if (!item) return;
    const word = item.word.toUpperCase();
    spellHintBox.innerHTML =
      `💡 <strong>Meaning:</strong> ${item.hint}<br>` +
      `🔤 <strong>Starts with:</strong> "${word[0]}" &nbsp;•&nbsp; ` +
      `<strong>Letters:</strong> ${word.length} &nbsp;•&nbsp; ` +
      `<strong>Ends with:</strong> "${word[word.length - 1]}"`;
    spellHintBox.classList.add('revealed');
    speakWordClearly();
  }

  /* ---------- Tab switching ---------- */
  function switchTab(tab) {
    currentTab = tab;
    tabStudy.classList.toggle('active', tab === 'study');
    tabSpell.classList.toggle('active', tab === 'spell');
    studyPanel.classList.toggle('hidden', tab !== 'study');
    spellPanel.classList.toggle('hidden', tab !== 'spell');
    stopSpeech();
    if (tab === 'spell') {
      resetSpellInputs();
      setTimeout(() => speakWordClearly(), 350);
    }
  }

  /* ---------- Count badges ---------- */
  function updateCountBadges() {
    for (const g of [1,2,3]) {
      countBadges[g].textContent = WORDS[g].length;
    }
  }

  /* ---------- Confetti celebration ---------- */
  function launchConfetti() {
    const emojis = ['🎉','⭐','🌈','✨','🎈','🐝','💜','🎊'];
    for (let i = 0; i < 28; i++) {
      const c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      c.style.animationDuration = (1.6 + Math.random() * 1.5) + 's';
      c.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3600);
    }
  }

  /* ---------- Material tap ripple ---------- */
  function addRipple(e) {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const d = Math.max(rect.width, rect.height) * 2.2;
    const span = document.createElement('span');
    span.className = 'ripple';
    const cx = (e.clientX || rect.left + rect.width / 2) - rect.left;
    const cy = (e.clientY || rect.top + rect.height / 2) - rect.top;
    span.style.width = span.style.height = d + 'px';
    span.style.left = (cx - d / 2) + 'px';
    span.style.top  = (cy - d / 2) + 'px';
    btn.appendChild(span);
    setTimeout(() => span.remove(), 600);
  }

  /* ---------- Init ---------- */
  function init() {
    buildStars();
    updateCountBadges();
    loadGrade(1);

    tabStudy.addEventListener('click', () => switchTab('study'));
    tabSpell.addEventListener('click', () => switchTab('spell'));

    gradeBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const g = parseInt(e.currentTarget.dataset.grade, 10);
        if (g === currentGrade) return;
        loadGrade(g);
      });
    });

    // Study tab — navigation pronounces the new word immediately
    speakBtn.addEventListener('click', speakStudyWord);
    prevBtn.addEventListener('click', () => { prevWord(); speakStudyWord(); });
    nextBtn.addEventListener('click', () => { nextWord(); speakStudyWord(); });
    shuffleBtn.addEventListener('click', () => { shuffleWords(); speakStudyWord(); });
    resetBtn.addEventListener('click', resetProgress);

    // Spell tab
    speakerBig.addEventListener('click', speakCurrentWord);
    spellSpeakBtn.addEventListener('click', speakCurrentWord);
    spellHintBtn.addEventListener('click', showSpellHint);
    spellCheckBtn.addEventListener('click', checkSpelling);
    spellPrevBtn.addEventListener('click', prevWord);
    spellNextBtn.addEventListener('click', () => {
      nextWord();
      setTimeout(() => speakWordClearly(), 300);
    });
    spellResetBtn.addEventListener('click', resetProgress);

    toggleWordList.addEventListener('click', toggleWordBank);

    // Material ripple on all pressable controls
    document.querySelectorAll('.btn, .grade-btn, .tab-btn, .speaker-big').forEach(b => {
      b.addEventListener('click', addRipple);
    });

    // Load voices (Chrome loads async)
    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
      setTimeout(loadVoices, 250);
      setTimeout(loadVoices, 1000);
    }

    // Global keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement.tagName;
      if (currentTab === 'study') {
        if (e.code === 'Space' && !e.repeat && tag !== 'BUTTON' && tag !== 'INPUT') {
          e.preventDefault();
          speakStudyWord();
        }
        if (e.code === 'ArrowRight') { e.preventDefault(); nextWord(); }
        if (e.code === 'ArrowLeft')  { e.preventDefault(); prevWord(); }
        if (e.code === 'Home')       { e.preventDefault(); resetProgress(); }
      }
      if (currentTab === 'spell') {
        if (e.code === 'Space' && !e.repeat && tag !== 'INPUT') {
          e.preventDefault();
          speakCurrentWord();
        }
        if (e.code === 'ArrowLeft' && tag !== 'INPUT')  { e.preventDefault(); prevWord(); }
        if (e.code === 'ArrowRight' && tag !== 'INPUT') { e.preventDefault(); nextWord(); }
        if (e.code === 'Home')                          { e.preventDefault(); resetProgress(); }
      }
    });
  }

  init();
})();
</script>
</body>
